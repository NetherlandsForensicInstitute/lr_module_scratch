output_path: output/${timestamp}_firing_pin_impression
input_file_path: data/2023/firing_pin_impression.csv

lrsystem: &firing_pin_cmc_lrsystem
  architecture: lrmodule.binary_lrsystem
  modules:
    steps:
      validate_data: validate_feature_data_type
      mcmc:
        method: mcmc
        include_plots: True
        bounding: elub_bounder
        # parameters copied from MCMC test
        distribution_h1: betabinomial
        parameters_h1:
          alpha:
            prior: uniform
            lower: 0.01
            upper: 100
          beta:
            prior: uniform
            lower: 0.01
            upper: 100
        distribution_h2: binomial
        parameters_h2:
          p:
            prior: beta
            alpha: 0.5
            beta: 0.5
        interval:
          - 0.05
          - 0.95

experiments:
  - name: single_run
    strategy: single_run
    lrsystem: *firing_pin_cmc_lrsystem
    data:
      provider:
        method: parse_features_from_csv_file
        file: ${input_file_path}
        hypothesis_column: hypothesis
        source_id_column:
          - weapon1
          - weapon2
        extra_fields:
          - split1
          - split2
          - split3
        ignore_columns:
          - accf
      splits:
        strategy: lrmodule.input_data.PredefinedCrossValidation
    output:
      - metrics
      - pav
      - ece
      - llr_interval
  - name: train_only
    strategy: train_only
    lrsystem: *firing_pin_cmc_lrsystem
    data_provider:
      method: parse_features_from_csv_file
      file: ${input_file_path}
      hypothesis_column: hypothesis
      source_id_column:
        - weapon1
        - weapon2
      ignore_columns:
        - accf
        - split1
        - split2
        - split3
