output_path: output/${timestamp}_firing_pin_impression_matlab_python

matlab_data: &matlab_data
  provider:
    method: parse_features_from_csv_file
    file: data/2023/firing_pin_impression.csv
    hypothesis_column: hypothesis
    source_id_column:
      - weapon1
      - weapon2
    feature_columns:
      - cmc
      - n
    extra_fields:
      - split1
      - split2
      - split3
  splits:
    strategy: lrmodule.input_data.PredefinedCrossValidation

python_data: &python_data
  provider:
    method: parse_features_from_csv_file
    file: data/2026/firing_pin_impression.csv
    hypothesis_column: Hypothesis
    source_id_column:
      - Weapon1
      - Weapon2
    feature_columns:
      - Matching Cells
      - Total Cells
    extra_fields:
      - Type1
      - Type2
      - Material1
      - Material2
  splits:
    strategy: lrmodule.input_data.CrossValidationPairs
    folds: 3
    random_state: 0
  filter:
    method: pipeline
    steps:
      content_filter:
        method: lrmodule.content_filter.parse_content_filter
        condition:
          type: and
          conditions:
            - type: columns_equal
              column1: Type1
              column2: Type2
            - type: equals
              column: Type1
              value: 125b
      source_repeat_filter:
        method: lrmodule.content_filter.SourcePairRepeatFilter
        repeat: 1

firing_pin_cmc_lrsystem: &firing_pin_cmc_lrsystem
  architecture: lrmodule.binary_lrsystem
  modules:
    steps:
      validate_data: validate_feature_data_type
      mcmc:
        method: mcmc
        include_plots: True
        distribution_h1: betabinomial
        parameters_h1:
          alpha:
            prior: uniform
            lower: 0.01
            upper: 100
          beta:
            prior: uniform
            lower: 0.01
            upper: 100
        distribution_h2: binomial
        parameters_h2:
          p:
            prior: beta
            alpha: 0.5
            beta: 0.5
        interval:
          - 0.05
          - 0.95
        draw_count: 100
        tune_count: 10000
      bounding: elub_bounder

output: &output_list
  - method: metrics_csv
    columns:
      - cllr
      - cllr_min
      - devpav
      - lrmodule.metrics.count
      - lrmodule.metrics.count_h1
      - lrmodule.metrics.count_h2
      - lrmodule.metrics.mean_llr_h1
      - lrmodule.metrics.mean_llr_h2
  - lr_histogram
  - llr_interval
  - llr_overestimation
  - ece

experiments:
  - name: matlab
    strategy: single_run
    lrsystem: *firing_pin_cmc_lrsystem
    data: *matlab_data
    output: *output_list
  - name: python
    strategy: single_run
    lrsystem: *firing_pin_cmc_lrsystem
    data: *python_data
    output: *output_list
