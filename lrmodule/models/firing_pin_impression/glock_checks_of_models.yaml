output_path: output/glock_checks_of_models

input_file_fp: data/2026-Q4/all_glocks/firing_pin_impression.csv
input_file_fp_grid: data/2026-Q4/all_glocks/2d_grid.csv

##################
# Data providers #
##################

fp_data:
  method: parse_features_from_csv_file
  file: ${input_file_fp}
  hypothesis_column: Hypothesis
  source_id_column:
    - Weapon1
    - Weapon2
  feature_columns:
    - Matching Cells
    - Total Cells
  extra_fields:
    - Material1
    - Material2

fp_grid:
  method: parse_features_from_csv_file
  file: ${input_file_fp_grid}
#  feature_columns:
#    - Matching Cells
#    - Total Cells

##############
# LR systems #
##############

fp_lrsystem:
  architecture: binary_lrsystem
  modules:
    method: logging_pipeline
    include_fields:
      - source_ids
    steps:
      validate_data: validate_feature_data_type
      mcmc:
        method: mcmc
        include_plots: True
        distribution_h1: betabinomial
        parameters_h1:
          alpha:
            prior: uniform
            lower: 0.01
            upper: 100
          beta:
            prior: uniform
            lower: 0.01
            upper: 100
        distribution_h2: binomial
        parameters_h2:
          p:
            prior: beta
            alpha: 0.5
            beta: 0.5
        interval:
          - 0.05
          - 0.95
      bounder: iv_bounder

