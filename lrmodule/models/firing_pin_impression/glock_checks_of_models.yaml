###########
# Filters #
###########

filter_heterogenous:
  # Filter to only include pairs of different material
  method: lrmodule.content_filter.parse_content_filter
  condition:
    type: columns_not_equal
    column1: Material1
    column2: Material2

filter_homogeneous:
  # Filter to only include pairs of the same material
  method: lrmodule.content_filter.parse_content_filter
  condition:
    type: columns_equal
    column1: Material1
    column2: Material2

nickel_only_condition:
  type: and
  conditions:
    - type: equals
      column: Material1
      value: "Nickel"
    - type: equals
      column: Material2
      value: "Nickel"

filter_nickel_only:
  # Filter to only include Nickel-Nickel pairs
  method: lrmodule.content_filter.parse_content_filter
  condition: ${nickel_only_condition}

brass_only_condition:
  type: and
  conditions:
    - type: equals
      column: Material1
      value: "Brass"
    - type: equals
      column: Material2
      value: "Brass"

filter_brass_only:
  # Filter to only include Brass-Brass pairs
  method: lrmodule.content_filter.parse_content_filter
  condition: ${brass_only_condition}

data_parameters:
  - name: filter.steps.filter_materials
    options:
      - option_name: no_filter
        substitutions:
          - path: filter.steps.filter_materials
            value: identity
      - option_name: filter_heterogenous
        substitutions:
          - path: filter.steps.filter_materials
            value: ${filter_heterogenous}
      - option_name: filter_homogeneous
        substitutions:
          - path: filter.steps.filter_materials
            value: ${filter_homogeneous}
      - option_name: filter_nickel_only
        substitutions:
          - path: filter.steps.filter_materials
            value: ${filter_nickel_only}
      - option_name: filter_brass_only
        substitutions:
          - path: filter.steps.filter_materials
            value: ${filter_brass_only}

###############
# Experiments #
###############

data_splits:
  strategy: lrmodule.input_data.CrossValidationPairs
  folds: 3
  random_state: 0

experiments:
  - name: model fits
    strategy: grid
    lrsystem: ${fp_lrsystem}
    data:
      setup: splits
      provider: ${fp_data}
      filter:
        method: pipeline
        steps:
          filter_materials:
          write_csv:
            method: csv_writer
            path: data_after_filter.csv
      splits: ${data_splits}
    data_parameters: ${data_parameters}
    output:
