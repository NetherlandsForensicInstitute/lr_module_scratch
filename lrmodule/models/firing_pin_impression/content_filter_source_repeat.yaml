output_path: output/${timestamp}_firing_pin_impression_geq
input_file_path: data/2026/firing_pin_impression.csv

lrsystem: &firing_pin_cmc_lrsystem
  architecture: lrmodule.binary_lrsystem
  modules:
    steps:
      validate_data: validate_feature_data_type
      mcmc:
        method: mcmc
        distribution_h1: betabinomial
        parameters_h1:
          alpha:
            prior: uniform
            lower: 0.01
            upper: 100
          beta:
            prior: uniform
            lower: 0.01
            upper: 100
        distribution_h2: binomial
        parameters_h2:
          p:
            prior: beta
            alpha: 0.5
            beta: 0.5
        interval:
          - 0.05
          - 0.95
      elub: elub_bounder

data: &firing_pin_data
  provider:
    method: parse_features_from_csv_file
    file: ${input_file_path}
    hypothesis_column: Hypothesis
    source_id_column:
      - Weapon1
      - Weapon2
    feature_columns:
      - Matching Cells
      - Total Cells
    extra_fields:
      - Type1
      - Type2
      - Material1
      - Material2
  filter:
    method: pipeline
    steps:
      content_filter:
        method: lrmodule.content_filter.parse_content_filter
        condition:
          type: and
          conditions:
            - type: columns_equal
              column1: Type1
              column2: Type2
            - type: equals
              column: Type1
              value: b844
      source_repeat_filter:
        method: lrmodule.content_filter.SourcePairRepeatFilter
        repeat: 1
  splits:
    strategy: lrmodule.input_data.CrossValidationPairs
    folds: 3

experiments:
  - name: b844_source_repeats
    strategy: grid
    lrsystem: *firing_pin_cmc_lrsystem
    data: *firing_pin_data
    data_parameters:
      - path: filter.steps.source_repeat_filter.repeat
        options:
          - 1
          - 2
          -
    output:
      - metrics
      - pav
      - ece
      - llr_interval
