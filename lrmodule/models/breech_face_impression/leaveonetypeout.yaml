output_path: output/${timestamp}_breech_face_impression_cv
input_file_path: data/2026/breech_face_impression.csv

lrsystem: &breech_face_cmc_lrsystem
  architecture: lrmodule.binary_lrsystem
  modules:
    steps:
      validate_data: validate_feature_data_type
      mcmc:
        method: mcmc
        distribution_h1: betabinomial
        parameters_h1:
          alpha:
            prior: uniform
            lower: 0.01
            upper: 100
          beta:
            prior: uniform
            lower: 0.01
            upper: 100
        distribution_h2: binomial
        parameters_h2:
          p:
            prior: beta
            alpha: 0.5
            beta: 0.5
        interval:
          - 0.05
          - 0.95
      elub: elub_bounder


experiments:
  - name: leave_one_type_out
    strategy: single_run
    lrsystem: *breech_face_cmc_lrsystem
    data:
      provider:
        method: parse_features_from_csv_file
        file: ${input_file_path}
        hypothesis_column: Hypothesis
        source_id_column:
          - Weapon1
          - Weapon2
        feature_columns:
          - Matching Cells
          - Total Cells
        extra_fields:
          - Type1
          - Type2 
          
      filter:
          method: lrmodule.content_filter.parse_content_filter
          condition:
            type: columns_equal
            column1: Type1
            column2: Type2

      splits:
        strategy: leave_one_category_out
        category_field: Type1


    output:
      - method: by_category
        category_field: Type1
        output:
        - metrics
        - pav
        - ece
        - llr_interval

