# Full LR model for breech face impressions on the `all_types` data set (2026-Q4).
#
# The breech face impression is quantified by the number of matching cells out of the total number of cells.
# Under H1 (same source), the matching-cell count is modeled with a beta-binomial distribution; under H2
# (different sources), a binomial distribution is used. The model parameters are inferred with MCMC, which also
# yields credible intervals around the LLRs. The performance of the model is assessed with 3-fold
# cross-validation over source pairs, after which the model is saved for application in casework.
output_path: output/${timestamp}_breech_face_impression
input_file_path: data/2026-Q4/all_types/breech_face_impression.csv

lrsystem:
  architecture: binary_lrsystem
  modules:
    # Log the source ids together with the pipeline results, so that each LLR can be traced back to a pair.
    method: logging_pipeline
    include_fields:
      - source_ids
    steps:
      # Ensure that the model can only be used on input data of the same type and dimensions as the training data.
      validate_data: validate_feature_data_type
      mcmc:
        method: mcmc
        # Save plots and csv files of the sampled posterior distributions of the model parameters.
        include_parameter_outputs: True
        # H1 (same source): beta-binomial distribution for the matching-cell count.
        distribution_h1: betabinomial
        parameters_h1:
          alpha:
            prior: uniform
            lower: 0.01
            upper: 100
          beta:
            prior: uniform
            lower: 0.01
            upper: 100
        # H2 (different sources): binomial distribution for the matching-cell count.
        distribution_h2: binomial
        parameters_h2:
          p:
            prior: beta
            alpha: 0.5
            beta: 0.5
        # Quantiles of the credible interval around the median LLR.
        interval:
          - 0.05
          - 0.95
      # Bound the LLRs using the Invariance Verification method.
      bounder: iv_bounder

experiments:
  - name: model
    strategy: single_run
    lrsystem: ${lrsystem}
    data:
      setup: splits
      provider:
        method: parse_features_from_csv_file
        file: ${input_file_path}
        hypothesis_column: Hypothesis
        source_id_column:
          - Weapon1
          - Weapon2
        feature_columns:
          - Matching Cells
          - Total Cells
      splits:
        strategy: lrmodule.input_data.CrossValidationPairs
        folds: 3
        random_state: 0

    output:
      - method: metrics
        columns:
          - cllr
          - cllr_min
          - devpav
      # Store the input data with the model results, so that the model can be traced back to its data.
      - method: lrmodule.copy_csv.copy_csv
        file: ${input_file_path}
        new_file_name: reference_data.csv
      - pav
      - ece
      - lr_histogram
      - llr_interval
      - nbe
      - invariance_delta_function
      - tippett
      - llr_overestimation
      - save_model
