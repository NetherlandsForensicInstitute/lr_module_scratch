output_path: output/ab_ba

# The `all_types` dataset contains every comparison in both directions: as (A,B) and as (B,A).
input_file_fp: data/2026-Q4/all_types/firing_pin_impression.csv
input_file_bf: data/2026-Q4/all_types/breech_face_impression.csv
input_file_as: data/2026-Q4/all_types/aperture_shear.csv

##################
# Data providers #
##################

fp_data:
  method: parse_features_from_csv_file
  file: ${input_file_fp}
  hypothesis_column: Hypothesis
  source_id_column:
    - Weapon1
    - Weapon2
  feature_columns:
    - Matching Cells
    - Total Cells
  extra_fields:
    - Material1
    - Material2

bf_data:
  method: parse_features_from_csv_file
  file: ${input_file_bf}
  hypothesis_column: Hypothesis
  source_id_column:
    - Weapon1
    - Weapon2
  feature_columns:
    - Matching Cells
    - Total Cells
  extra_fields:
    - Material1
    - Material2

# Aperture shear has no cell counts, so a direction based on N cannot be defined.
as_data:
  method: parse_features_from_csv_file
  file: ${input_file_as}
  hypothesis_column: Hypothesis
  source_id_column:
    - Weapon1
    - Weapon2
  feature_columns:
    - Score
  extra_fields:
    - Material1
    - Material2

data_splits:
  strategy: lrmodule.input_data.CrossValidationPairs
  folds: 3
  random_state: 0

##############
# LR systems #
##############

fp_lrsystem:
  architecture: lrmodule.binary_lrsystem
  modules:
    method: logging_pipeline
    include_fields:
      - source_ids
    steps:
      validate_data: validate_feature_data_type
      mcmc:
        method: mcmc
        distribution_h1: betabinomial
        parameters_h1:
          alpha:
            prior: uniform
            lower: 0.01
            upper: 100
          beta:
            prior: uniform
            lower: 0.01
            upper: 100
        distribution_h2: binomial
        parameters_h2:
          p:
            prior: beta
            alpha: 0.5
            beta: 0.5
        interval:
          - 0.05
          - 0.95
      bounder: iv_bounder

bf_lrsystem:
  architecture: lrmodule.binary_lrsystem
  modules:
    steps:
      validate_data: validate_feature_data_type
      mcmc:
        method: mcmc
        distribution_h1: betabinomial
        parameters_h1:
          alpha:
            prior: uniform
            lower: 0.01
            upper: 100
          beta:
            prior: uniform
            lower: 0.01
            upper: 100
        distribution_h2: binomial
        parameters_h2:
          p:
            prior: beta
            alpha: 0.5
            beta: 0.5
        interval:
          - 0.05
          - 0.95
      bounding: iv_bounder

as_lrsystem:
  architecture: lrmodule.binary_lrsystem
  modules:
    steps:
      validate_data: validate_feature_data_type
      transform:
        method: lrmodule.helpers.transform_marktype_ccf
      bootstrap:
        method: bootstrap
        n_bootstraps: 25
        seed: 0
        points: equidistant
        n_points: 100
        steps:
          kde:
            method: kde
            bandwidth:
              - 0.05 # KNM kernel size
              - 0.23 # KM kernel size
          bounder: iv_bounder

###########
# Outputs #
###########

outputs:
  # These outputs are the same across experiments.
  - method: metrics_csv
    columns:
      - cllr
      - cllr_min
      - lrmodule.metrics.count
      - devpav
      - lrmodule.metrics.count_h1
      - lrmodule.metrics.count_h2
      - lrmodule.metrics.mean_llr_h1
      - lrmodule.metrics.mean_llr_h2
  - method: metrics_bars
    metrics:
      - cllr
      - cllr_min
  - pav
  - ece
  - llr_interval
  - lr_histogram
  - llr_overestimation

###########
# Filters #
###########

filter_first_direction:
  # Keep the first occurring direction of each source pair: (A, B).
  method: lrmodule.content_filter.SourcePairRepeatFilter
  repeat: 1

filter_second_direction:
  # Keep the second occurring direction of each source pair: (B, A).
  method: lrmodule.content_filter.SourcePairRepeatFilter
  repeat: 2

filter_a_smallest:
  # Always take the smallest trace (lowest N) as A, and the largest as B.
  method: lrmodule.content_filter.PairDirectionFilter
  direction: smallest_first
  column: Total Cells
  feature_columns:
    - Matching Cells
    - Total Cells

filter_a_largest:
  # Always take the largest trace (highest N) as A, and the smallest as B.
  method: lrmodule.content_filter.PairDirectionFilter
  direction: largest_first
  column: Total Cells
  feature_columns:
    - Matching Cells
    - Total Cells

# Options for the firing pin and breech face experiments: the direction rules need N.
data_parameters:
  - name: filter.steps.filter_direction
    options:
      - option_name: first_direction
        substitutions:
          - path: filter.steps.filter_direction
            value: ${filter_first_direction}
      - option_name: second_direction
        substitutions:
          - path: filter.steps.filter_direction
            value: ${filter_second_direction}
      - option_name: a_smallest
        substitutions:
          - path: filter.steps.filter_direction
            value: ${filter_a_smallest}
      - option_name: a_largest
        substitutions:
          - path: filter.steps.filter_direction
            value: ${filter_a_largest}

# Options for the aperture shear experiment: no N is available, so only occurrence-based rules apply.
data_parameters_shear:
  - name: filter.steps.filter_direction
    options:
      - option_name: first_direction
        substitutions:
          - path: filter.steps.filter_direction
            value: ${filter_first_direction}
      - option_name: second_direction
        substitutions:
          - path: filter.steps.filter_direction
            value: ${filter_second_direction}

###############
# Experiments #
###############

experiments:
  - name: firing pin
    strategy: grid
    lrsystem: ${fp_lrsystem}
    data:
      provider: ${fp_data}
      filter:
        method: pipeline
        steps:
          filter_direction:
          write_csv:
            method: csv_writer
            path: data_after_filter.csv
      splits: ${data_splits}
    data_parameters: ${data_parameters}
    output: ${outputs}
  - name: breech face
    strategy: grid
    lrsystem: ${bf_lrsystem}
    data:
      provider: ${bf_data}
      filter:
        method: pipeline
        steps:
          filter_direction:
          write_csv:
            method: csv_writer
            path: data_after_filter.csv
      splits: ${data_splits}
    data_parameters: ${data_parameters}
    output: ${outputs}
  - name: aperture shear
    strategy: grid
    enable_parallelization: True
    lrsystem: ${as_lrsystem}
    data:
      provider: ${as_data}
      filter:
        method: pipeline
        steps:
          filter_direction:
          write_csv:
            method: csv_writer
            path: data_after_filter.csv
      splits: ${data_splits}
    data_parameters: ${data_parameters_shear}
    output: ${outputs}
