output_path: output/${timestamp}_aperture_shear_cv
input_file_path: data/aperture_shear.csv

aperture_shear_ccf_lrsystem: &aperture_shear_ccf_lrsystem
  architecture: lrmodule.binary_lrsystem
  modules:
    steps:
      validate_data: validate_feature_data_type
      transform:
        method: lrmodule.helpers.transform_marktype_ccf
      bootstrap:
        method: bootstrap
        n_bootstraps: 2
        seed: 0
        points: equidistant
        n_points: 100
        steps:
          kde:
            method: kde
            bandwidth:
              - 0.05 # KNM kernel size
              - 0.23 # KM kernel size
          elub: elub_bounder

experiments:
  - name: crossvalidation_comparison
    strategy: grid
    lrsystem: *aperture_shear_ccf_lrsystem
    data:
      provider:
        method: parse_features_from_csv_file
        file: ${input_file_path}
        label_column: hypothesis
        source_id_column:
          - weapon1
          - weapon2
        extra_fields:
          - split1
          - split2
          - split3
      splits:
        strategy: lrmodule.input_data.PredefinedCrossValidation
    data_parameters:
      - path: splits
        options:
          - option_name: predefined
            value:
              strategy: lrmodule.input_data.PredefinedCrossValidation
          - option_name: pairs
            value:
              strategy: lrmodule.input_data.CrossValidationPairs
              folds: 3
              random_state: 0
    output:
      - metrics
      - pav
      - ece
      - llr_interval
