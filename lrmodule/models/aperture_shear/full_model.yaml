# Full LR model for aperture shear on the `all_types` data set (2026-Q4).
#
# The aperture shear mark is quantified by a single CCF score. This score is transformed to the log-odds scale,
# after which the LR is estimated with a KDE calibrator. A bootstrap procedure provides confidence intervals
# around the LLRs. The performance of the model is assessed with 3-fold cross-validation over source pairs,
# after which the model is saved for application in casework.
output_path: output/${timestamp}_aperture_shear
input_file_path: data/2026-Q4/all_types/aperture_shear.csv

lrsystem:
  architecture: binary_lrsystem
  modules:
    # Log the source ids together with the pipeline results, so that each LLR can be traced back to a pair.
    method: logging_pipeline
    include_fields:
      - source_ids
    steps:
      # Ensure that the model can only be used on input data of the same type and dimensions as the training data.
      validate_data: validate_feature_data_type
      # Transform the CCF score from [-1, 1] to the log10-odds scale.
      transform:
        method: lrmodule.helpers.transform_marktype_ccf
      bootstrap:
        method: bootstrap
        n_bootstraps: 25
        seed: 0
        points: equidistant
        n_points: 1000 # number of equidistant points at which the intervals are interpolated
        steps:
          kde:
            method: kde
            bandwidth:
              - 0.05 # KNM kernel size
              - 0.23 # KM kernel size
          bounder: iv_bounder

experiments:
  - name: model
    strategy: single_run
    lrsystem: ${lrsystem}
    data:
      setup: splits
      provider:
        method: parse_features_from_csv_file
        file: ${input_file_path}
        hypothesis_column: Hypothesis
        source_id_column:
          - Weapon1
          - Weapon2
        feature_columns:
          - Score
      splits:
        strategy: lrmodule.input_data.CrossValidationPairs
        folds: 3
        random_state: 0

    output:
      - method: metrics
        columns:
          - cllr
          - cllr_min
          - devpav
      # Store the input data with the model results, so that the model can be traced back to its data.
      - method: lrmodule.copy_csv.copy_csv
        file: ${input_file_path}
        new_file_name: reference_data.csv
      - pav
      - ece
      - lr_histogram
      - llr_interval
      - nbe
      - invariance_delta_function
      - tippett
      - llr_overestimation
      - save_model
