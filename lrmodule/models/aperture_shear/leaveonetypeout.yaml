output_path: output/${timestamp}_aperture_shear_cv
input_file_path: data/2026/aperture_shear.csv

aperture_shear_ccf_lrsystem: &aperture_shear_ccf_lrsystem
  architecture: lrmodule.binary_lrsystem
  modules:
    steps:
      validate_data: validate_feature_data_type
      transform:
        method: lrmodule.helpers.transform_marktype_ccf
      bootstrap:
        method: bootstrap
        n_bootstraps: 2
        seed: 0
        points: equidistant
        n_points: 100
        steps:
          kde:
            method: kde
            bandwidth:
              - 0.05 # KNM kernel size
              - 0.23 # KM kernel size
          elub: elub_bounder

experiments:
  - name: leave_one_type_out
    strategy: single_run
    lrsystem: *aperture_shear_ccf_lrsystem
    data:
      provider:
        method: parse_features_from_csv_file
        file: ${input_file_path}
        hypothesis_column: Hypothesis
        source_id_column:
          - Weapon1
          - Weapon2
        feature_columns:
          - Score
        extra_fields:
          - Type1
          - Type2 
          
      filter:
          method: lrmodule.content_filter.parse_content_filter
          condition:
            type: columns_equal
            column1: Type1
            column2: Type2

      splits:
        strategy: leave_one_category_out
        category_field: Type1


    output:
      - method: by_category
        category_field: Type1
        output:
        - metrics
        - pav
        - ece
        - llr_interval

