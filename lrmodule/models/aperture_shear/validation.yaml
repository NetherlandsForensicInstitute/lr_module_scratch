output_path: output/${timestamp}_aperture_shear
input_file_path: data.csv  # update path

aperture_shear_ccf_lrsystem: &aperture_shear_ccf_lrsystem
  architecture: lrmodule.binary_lrsystem
  modules:
    steps:
      validate_data: validate_feature_data_type
      transform:
        method: lrmodule.helpers.transform_marktype_ccf
      bootstrap:
        method: bootstrap
        n_bootstraps: 2
        seed: 0
        points: equidistant
        n_points: 100
        steps:
          kde:
            method: kde
            bandwidth:
              - 0.05  # KNM kernel size
              - 0.23  # KM kernel size
          elub: elub_bounder

experiments:
  - name: model
    strategy: single_run
    lrsystem: *aperture_shear_ccf_lrsystem
    data:
      provider:
        method: parse_features_from_csv_file
        file: ${input_file_path}
        label_column: hypothesis
        source_id_column: 
          - weapon1
          - weapon2
        extra_fields:
          - split1
          - split2
          - split3
      splits:
        strategy: lrmodule.input_data.PredefinedCrossValidation
    output:
      - method: metrics
        columns:
          - cllr
          - cllr_min
      - pav
      - ece
      - llr_interval
      - save_model
      - method: lrmodule.copy_csv.copy_csv
        file: ${input_file_path}
        new_file_name: reference_data.csv
        columns:
          - hypothesis
          - ccf
      # - score_histogram (ongetransformeerd)
      # - score_histogram (normalized (area=1))
