output_path: output/${timestamp}_aperture_shear_matlab_python

matlab_data: &matlab_data
  provider:
    method: parse_features_from_csv_file
    file: data/2023/aperture_shear.csv
    hypothesis_column: hypothesis
    source_id_column:
      - weapon1
      - weapon2
    feature_columns:
      - ccf
    extra_fields:
      - split1
      - split2
      - split3
  splits:
    strategy: lrmodule.input_data.PredefinedCrossValidation

python_data: &python_data
  provider:
    method: parse_features_from_csv_file
    file: data/2026/aperture_shear.csv
    hypothesis_column: Hypothesis
    source_id_column:
      - Weapon1
      - Weapon2
    feature_columns:
      - Score
    extra_fields:
      - Type1
      - Type2
      - Material1
      - Material2
  splits:
    strategy: lrmodule.input_data.CrossValidationPairs
    folds: 3
    random_state: 0
  filter:
    method: pipeline
    steps:
      content_filter:
        method: lrmodule.content_filter.parse_content_filter
        condition:
          type: and
          conditions:
            - type: columns_equal
              column1: Type1
              column2: Type2
            - type: equals
              column: Type1
              value: 125b
      source_repeat_filter:
        method: lrmodule.content_filter.SourcePairRepeatFilter
        repeat: 1

aperture_shear_ccf_lrsystem: &aperture_shear_ccf_lrsystem
  architecture: lrmodule.binary_lrsystem
  modules:
    steps:
      validate_data: validate_feature_data_type
      save_features:
        method: save_features
        save_as: score
      transform:
        method: lrmodule.helpers.transform_marktype_ccf
      bootstrap:
        method: bootstrap
        n_bootstraps: 40
        seed: 0
        points: equidistant
        n_points: 100
        steps:
          kde:
            method: kde
            bandwidth:
              - 0.05 # KNM kernel size
              - 0.23 # KM kernel size
          bounding: elub_bounder

output: &output_list
  - method: metrics_csv
    columns:
      - cllr
      - cllr_min
      - devpav
      - lrmodule.metrics.count
      - lrmodule.metrics.count_h1
      - lrmodule.metrics.count_h2
      - lrmodule.metrics.mean_llr_h1
      - lrmodule.metrics.mean_llr_h2
  - lr_histogram
  - llr_interval
  - llr_overestimation
  - ece
  - score_distribution

experiments:
  - name: matlab
    strategy: single_run
    lrsystem: *aperture_shear_ccf_lrsystem
    data: *matlab_data
    output: *output_list
  - name: python
    strategy: single_run
    lrsystem: *aperture_shear_ccf_lrsystem
    data: *python_data
    output: *output_list
